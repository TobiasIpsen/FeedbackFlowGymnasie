name: Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  workflow_job:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Pulls repo into $GITHUB_WORKSPACE

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5 # Required to build & test
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies API
        run: dotnet restore ./feedbackFlowAPI/feedbackFlowAPI.csproj # Fetches NuGet packages.

      - name: Build code API
        run: dotnet build ./feedbackFlowAPI/feedbackFlowAPI.csproj --no-restore # Compiles code

      - name: Run tests
        run: dotnet test ./feedbackFlowFront/feedbackFlowFront.csproj --no-build --verbosity normal # Runs tests

      - name: Login to Docker Hub
        uses: docker/login-action@v3 # Logs in to docker hub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7 # Builds and pushes image to docker hub.
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/feedbackFlowAPI:latest