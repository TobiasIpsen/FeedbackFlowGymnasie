name: Pull Request

on:
  pull_request:
    branches: [main]

jobs:
  workflow_job:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies Frontend
        run: dotnet restore ./feedbackFlowFront/feedbackFlowFront.csproj
        
      - name: Build code Frontend
        run: dotnet build ./feedbackFlowFront/feedbackFlowFront.csproj --no-restore

      # - name: Run tests
      #   run: dotnet test ./feedbackFlowFront/feedbackFlowFront.csproj --no-build --verbosity normal

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/feedbackFlowFrontend:latest