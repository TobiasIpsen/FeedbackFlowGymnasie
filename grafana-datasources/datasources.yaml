apiVersion: 1

datasources:
  - uid: prometheus
    name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

    jsonData:
      httpMethod: POST

  - uid: loki
    name: Loki
    type: loki
    access: proxy
    url: http://loki:3100

    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: "trace_id=(\\w+)"
          datasourceUid: tempo
          url: "$${__value.raw}"

  - uid: tempo
    name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200

    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        filterBySpanID: true

      tracesToMetrics:
        datasourceUid: prometheus
        
      serviceMap:
        datasourceUid: prometheus

      nodeGraph:
        enabled: true

      search:
        hide: false